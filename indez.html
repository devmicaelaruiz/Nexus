<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Comando</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.pre{white-space:pre-wrap}[hidden]{display:none!important}</style>
</head>
<body class="h-screen overflow-hidden bg-white text-sm text-slate-900">
<div id="app" class="h-screen"></div>
<script>
/* ================= CONFIG ================= */
const MODEL = "gemini-2.5-flash"; // modelo con capa gratuita
const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
const POLL_MS = 60000; // Zendesk/Slack: consulta cada minuto

const SYSTEM_PROMPT = `Eres "PM Copilot", analista senior de un Project Manager que gestiona proyectos y evolutivos de software.
Recibes siempre: (1) metadatos del ticket, (2) hilo EXTERNO de Zendesk (cliente), (3) hilo INTERNO de Slack (equipo técnico).
Reglas:
- Responde SIEMPRE en español, tono profesional y directo. Máximo 150 palabras en total.
- Basa todo en los hilos. Si un dato no aparece, escribe "No consta" y nunca lo inventes (fechas, horas, compromisos).
- Lo que se dice en Slack es interno: nunca lo cites literalmente ni lo expongas en el borrador para el cliente.
- "Quién tiene el balón" debe ser UNO de: Cliente | Operaciones | Desarrollo | QA | Project Manager. Justifícalo en una frase.

Cuando se te pida un REPORTE, usa exactamente este formato Markdown:

**📣 Novedad**
<1-2 frases: qué acaba de pasar y dónde (Zendesk/Slack/estado)>

**🏀 ¿De qué lado está la cancha?**
<Actor> — <motivo en una frase>

**➡️ Siguientes pasos**
- <acción concreta> (responsable)

**❓ ¿Qué falta?**
- <bloqueador, documento, confirmación o fecha pendiente>

**✉️ Sugerencia de acción**
<Borrador listo para enviar al cliente en Zendesk si el equipo ya tiene respuesta, o un follow-up breve para destrabar al equipo en Slack. Indica al inicio entre corchetes [Para Cliente] o [Para Equipo].>

Cuando se te haga una PREGUNTA libre, responde con base en el mismo contexto, sin usar el formato de reporte.`;
const REPORT = "Hay una actualización nueva. Genera el REPORTE con el formato exacto.";

/* ============ DATOS Y APIs (SIMULADOS) ============
   Reemplaza fetchZendesk/fetchSlack por llamadas a tu proxy (Zendesk y Slack bloquean CORS en el navegador).
   Slack: el canal se mapea por ticket, p. ej. #ticket-<id>. */
const TICKETS = [
  { id: "4821", subject: "Evolutivo: exportar facturas a SAP", client: "Acme SA", status: "Esperando cliente", agent: "Lucía R.", due: "2026-10-30", hours: 24 },
  { id: "4830", subject: "Incidencia: error en conciliación", client: "Globex", status: "En desarrollo", agent: "Marco T.", due: "2026-10-12", hours: 8 },
  { id: "4835", subject: "Evolutivo: nuevo reporte de ventas", client: "Initech", status: "En QA", agent: "Lucía R.", due: "2026-11-05", hours: 16 },
];
const MOCK = {
  "4821": { z: [{ id: "z1", author: "Cliente (Acme)", text: "¿Cuándo tendremos la exportación a SAP? Necesitamos confirmar fecha.", at: "09:10" }],
            s: [{ id: "s1", author: "Dev Carlos", text: "El mapeo de campos está listo, falta QA. Estimo entrega el 28.", at: "09:40" }] },
  "4830": { z: [{ id: "z1", author: "Cliente (Globex)", text: "La conciliación sigue duplicando asientos.", at: "08:30" }],
            s: [{ id: "s1", author: "Dev Marco", text: "Reproduje el error, es un tema de redondeo.", at: "09:05" }] },
  "4835": { z: [{ id: "z1", author: "Cliente (Initech)", text: "Adjuntamos el formato del reporte.", at: "10:00" }],
            s: [{ id: "s1", author: "QA Ana", text: "Pruebas al 60%, faltan casos de fin de mes.", at: "10:20" }] },
};
const fetchZendesk = async id => structuredClone(MOCK[id].z);
const fetchSlack = async id => structuredClone(MOCK[id].s);

/* ================= UTILIDADES ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const now = () => new Date().toTimeString().slice(0, 5);
const inp = "w-full rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400";
const btn = "rounded-md bg-slate-900 px-3 py-1.5 text-sm text-white hover:bg-slate-700 disabled:opacity-50";
const btn2 = "rounded-md border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-100 disabled:opacity-50";
const STATUS = ["Nuevo", "En desarrollo", "En QA", "Esperando cliente", "Resuelto"];
const AGENTS = ["Lucía R.", "Marco T.", "Carlos D."];

async function askGemini(key, context, instruction) {
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [{ role: "user", parts: [{ text: `${context}\n\n---\n${instruction}` }] }],
      generationConfig: { temperature: 0.3, maxOutputTokens: 900 },
    }),
  });
  if (!res.ok) {
    if (res.status === 429) throw new Error("Límite gratuito de Gemini alcanzado. Reintenta en un minuto.");
    if (res.status === 400 || res.status === 403) throw new Error("API key de Gemini inválida o sin permisos.");
    throw new Error("Gemini respondió " + res.status);
  }
  const d = await res.json();
  return (d.candidates?.[0]?.content?.parts || []).map(p => p.text).join("") || "Sin respuesta.";
}

/* ================= LOGIN ================= */
/* Gate de demostración: en un sitio estático no hay seguridad real.
   Para producción usa Supabase Auth o Firebase Auth. */
function showLogin() {
  $("#app").innerHTML = `
  <div class="grid h-screen place-items-center bg-slate-100">
    <form id="lf" class="w-80 space-y-3 rounded-lg border bg-white p-6 shadow-sm">
      <h1 class="text-lg font-semibold">Centro de Comando</h1>
      <input name="u" class="${inp}" placeholder="Correo" autocomplete="username">
      <input name="p" type="password" class="${inp}" placeholder="Contraseña" autocomplete="current-password">
      <p id="le" class="text-xs text-red-600"></p>
      <button class="${btn} w-full">Iniciar sesión</button>
    </form>
  </div>`;
  $("#lf").onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    if (!f.u.value || !f.p.value) return ($("#le").textContent = "Ingresa correo y contraseña.");
    sessionStorage.setItem("auth", "1"); showShell();
  };
}

/* ================= SHELL + PESTAÑAS ================= */
let tabs = [], active = "dash";
function showShell() {
  $("#app").innerHTML = `
  <div class="flex h-screen flex-col">
    <nav id="nav" class="flex items-end gap-1 overflow-x-auto border-b bg-slate-100 px-2 pt-2"></nav>
    <main id="main" class="min-h-0 flex-1"></main>
  </div>`;
  tabs = []; active = "dash";
  const m = $("#main");
  m.innerHTML = `<section id="p-dash" class="h-full overflow-y-auto p-6"></section>`;
  renderNav(); renderDash();
}
function renderNav() {
  const cls = on => `flex items-center gap-2 rounded-t-md px-3 py-2 ${on ? "bg-white font-medium" : "text-slate-500 hover:text-slate-900"}`;
  $("#nav").innerHTML =
    `<button data-go="dash" class="${cls(active === "dash")}">Dashboard</button>` +
    tabs.map(t => `<div class="${cls(active === t.id)}"><button data-go="${t.id}">#${t.id} ${esc(t.client)}</button><button data-x="${t.id}" aria-label="Cerrar #${t.id}" class="text-slate-400 hover:text-slate-900">✕</button></div>`).join("") +
    `<button id="out" class="${btn2} mb-1 ml-auto shrink-0">Salir</button>`;
  $("#nav").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $("#nav").querySelectorAll("[data-x]").forEach(b => b.onclick = () => closeTab(b.dataset.x));
  $("#out").onclick = () => { sessionStorage.removeItem("auth"); showLogin(); };
}
function go(id) {
  active = id;
  document.querySelectorAll("#main > section").forEach(s => s.hidden = s.id !== "p-" + id);
  if (id === "dash") renderDash();
  renderNav();
}
function closeTab(id) {
  tabs = tabs.filter(t => t.id !== id);
  $("#p-" + id)?.remove();
  go(active === id ? "dash" : active);
}
function openTicket(id) {
  if (!tabs.some(t => t.id === id)) {
    const t = structuredClone(TICKETS.find(x => x.id === id));
    tabs.push(t);
    const s = document.createElement("section");
    s.id = "p-" + id; s.className = "h-full"; $("#main").appendChild(s);
    buildTicket(s, t);
  }
  go(id);
}

/* ================= DASHBOARD (widgets + vistas) ================= */
const WIDGETS = {
  open: ["Tickets abiertos", T => T.filter(x => x.status !== "Resuelto").length],
  wait: ["Esperando cliente", T => T.filter(x => x.status === "Esperando cliente").length],
  hours: ["Horas de esfuerzo", T => T.reduce((a, x) => a + x.hours, 0)],
  qa: ["En QA", T => T.filter(x => x.status === "En QA").length],
};
const VIEWS = [
  ["Todos", () => true],
  ["Esperando cliente", t => t.status === "Esperando cliente"],
  ["Evolutivos", t => t.subject.startsWith("Evolutivo")],
];
let view = 0;
function renderDash() {
  let ws; try { ws = JSON.parse(localStorage.getItem("widgets")) } catch { }
  ws = ws || ["open", "wait", "hours"];
  const save = w => { localStorage.setItem("widgets", JSON.stringify(w)); renderDash(); };
  const T = [...TICKETS, ...[]].map(t => tabs.find(x => x.id === t.id) || t); // refleja ediciones
  const p = $("#p-dash");
  p.innerHTML = `
  <div class="mb-6 grid grid-cols-2 gap-3 lg:grid-cols-4">
    ${ws.map(k => `<div class="relative rounded-lg border p-4"><button data-rm="${k}" aria-label="Quitar widget" class="absolute right-2 top-2 text-slate-400 hover:text-slate-900">✕</button>
      <div class="text-slate-500">${WIDGETS[k][0]}</div><div class="text-3xl font-semibold">${WIDGETS[k][1](T)}</div></div>`).join("")}
    ${Object.keys(WIDGETS).filter(k => !ws.includes(k)).map(k => `<button data-add="${k}" class="rounded-lg border border-dashed p-4 text-slate-500 hover:bg-slate-50">+ ${WIDGETS[k][0]}</button>`).join("")}
  </div>
  <div class="mb-2 flex gap-2">${VIEWS.map((v, i) => `<button data-v="${i}" class="${i === view ? btn : btn2}">${v[0]}</button>`).join("")}</div>
  <div class="divide-y rounded-lg border">
    ${T.filter(VIEWS[view][1]).map(t => `<button data-t="${t.id}" class="flex w-full items-center justify-between p-3 text-left hover:bg-slate-50">
      <span>#${t.id} ${esc(t.subject)} <span class="text-slate-500">· ${esc(t.client)}</span></span>
      <span class="rounded bg-slate-100 px-2 py-0.5 text-xs">${esc(t.status)}</span></button>`).join("")}
  </div>`;
  p.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => save(ws.filter(x => x !== b.dataset.rm)));
  p.querySelectorAll("[data-add]").forEach(b => b.onclick = () => save([...ws, b.dataset.add]));
  p.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { view = +b.dataset.v; renderDash(); });
  p.querySelectorAll("[data-t]").forEach(b => b.onclick = () => openTicket(b.dataset.t));
}

/* ================= TICKET: 3 PANELES ================= */
function buildTicket(root, t) {
  let z = [], s = [], last = "", busy = false;
  const opt = (arr, v) => arr.map(a => `<option ${a === v ? "selected" : ""}>${a}</option>`).join("");
  const fld = (l, h) => `<label class="block space-y-1 text-xs font-medium text-slate-500">${l}${h}</label>`;
  root.innerHTML = `
  <div class="flex h-full min-h-0">
    <aside class="w-72 shrink-0 space-y-3 overflow-y-auto border-r p-4">
      ${fld("Cliente", `<input class="${inp}" data-k="client" value="${esc(t.client)}">`)}
      ${fld("Solicitante", `<input class="${inp}" placeholder="Nombre del solicitante">`)}
      ${fld("Agente asignado", `<select class="${inp}" data-k="agent">${opt(AGENTS, t.agent)}</select>`)}
      ${fld("Estado", `<select class="${inp}" data-k="status">${opt(STATUS, t.status)}</select>`)}
      ${fld("Etiquetas", `<input class="${inp}" placeholder="evolutivo, sap…">`)}
      ${fld("Fecha de entrega", `<input type="date" class="${inp}" data-k="due" value="${t.due}">`)}
      ${fld("Horas de esfuerzo", `<input type="number" class="${inp}" data-k="hours" value="${t.hours}">`)}
      <button data-sim class="${btn2} w-full">Simular mensaje nuevo (demo)</button>
    </aside>
    <section class="flex min-w-0 flex-1 flex-col">
      <div class="border-b px-4 py-3 font-semibold">#${t.id} ${esc(t.subject)}</div>
      <div class="mx-4 mt-2 flex w-fit gap-1 rounded-md bg-slate-100 p-1">
        <button data-tab="z" class="rounded px-3 py-1 bg-white font-medium">Zendesk (Externa)</button>
        <button data-tab="s" class="rounded px-3 py-1 text-slate-500">Slack (Interna)</button>
      </div>
      <div data-list="z" class="flex-1 overflow-y-auto p-4"></div>
      <div data-list="s" class="flex-1 overflow-y-auto p-4" hidden></div>
      <div class="flex gap-2 border-t p-3"><textarea rows="2" class="${inp}" data-reply placeholder="Responder al cliente…"></textarea><button class="${btn}">Enviar</button></div>
    </section>
    <aside class="flex w-[360px] shrink-0 flex-col border-l">
      <header class="border-b p-3"><h2 class="font-semibold">PM Copilot</h2>
        <input type="password" data-key class="${inp} mt-2 text-xs" placeholder="API key de Gemini (solo se guarda en este navegador)"></header>
      <div data-chat class="flex-1 space-y-3 overflow-y-auto p-3"><p class="text-slate-500">Cuando haya una novedad en Zendesk o Slack, aquí aparecerá el reporte.</p></div>
      <footer class="space-y-2 border-t p-3">
        <button data-rep class="${btn2} w-full">Generar reporte ahora</button>
        <form data-ask class="flex gap-2"><input class="${inp}" placeholder="Pregunta sobre el ticket…"><button class="${btn}">Enviar</button></form>
      </footer>
    </aside>
  </div>`;
  const q = x => root.querySelector(x), key = q("[data-key]"), chat = q("[data-chat]");
  key.value = localStorage.getItem("gemini_key") || "";

  // Metadatos
  root.querySelectorAll("[data-k]").forEach(e => e.onchange = () => { t[e.dataset.k] = e.dataset.k === "hours" ? +e.value : e.value; check(); });
  // Sub-pestañas Zendesk / Slack
  root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    root.querySelectorAll("[data-tab]").forEach(x => x.className = "rounded px-3 py-1 text-slate-500");
    b.className = "rounded px-3 py-1 bg-white font-medium";
    root.querySelectorAll("[data-list]").forEach(l => l.hidden = l.dataset.list !== b.dataset.tab);
    q("[data-reply]").placeholder = b.dataset.tab === "z" ? "Responder al cliente…" : "Mensaje al equipo…";
  });
  const draw = () => ["z", "s"].forEach(k => q(`[data-list=${k}]`).innerHTML = (k === "z" ? z : s).map(m =>
    `<div class="mb-3 rounded-md border p-3"><div class="mb-1 text-xs text-slate-500">${esc(m.author)} · ${m.at}</div>${esc(m.text)}</div>`).join(""));

  // Copilot
  const bubble = (txt, cls, label) => { chat.insertAdjacentHTML("beforeend", `<div class="pre rounded-md p-3 ${cls}">${label ? `<div class="mb-1 text-xs text-slate-500">${label}</div>` : ""}${md(txt)}</div>`); chat.scrollTop = chat.scrollHeight; };
  const fmt = m => m.map(x => `[${x.at}] ${x.author}: ${x.text}`).join("\n") || "(sin mensajes)";
  const ctx = () => `TICKET #${t.id} — ${t.subject}\nCliente: ${t.client} | Estado: ${t.status} | Agente: ${t.agent} | Entrega: ${t.due} | Horas: ${t.hours}\n\n=== ZENDESK (externo) ===\n${fmt(z)}\n\n=== SLACK (interno) ===\n${fmt(s)}`;
  async function run(instr, auto) {
    if (!key.value) return bubble("Pega tu API key de Gemini para activar el copilot.", "text-red-600");
    busy = true;
    const wait = document.createElement("p"); wait.className = "text-xs text-slate-500"; wait.textContent = "Analizando hilos…"; chat.appendChild(wait);
    try { bubble(await askGemini(key.value, ctx(), instr), "border", auto ? "Reporte automático" : ""); }
    catch (e) { bubble(e.message, "text-red-600"); }
    wait.remove(); busy = false;
  }
  // Reporte automático ante cada novedad (mensaje nuevo o cambio de estado)
  function check() {
    const sig = `${t.status}|${z.at(-1)?.id}|${s.at(-1)?.id}`;
    if (!key.value || busy || sig === last) return;
    last = sig; run(REPORT, true);
  }
  key.onchange = () => { localStorage.setItem("gemini_key", key.value); check(); };
  q("[data-rep]").onclick = () => run(REPORT, false);
  q("[data-ask]").onsubmit = e => { e.preventDefault(); const i = e.target.querySelector("input"); if (!i.value.trim()) return; bubble(i.value, "ml-8 bg-slate-100"); run(i.value, false); i.value = ""; };

  // Polling minuto a minuto
  async function poll() { [z, s] = await Promise.all([fetchZendesk(t.id), fetchSlack(t.id)]); draw(); check(); }
  q("[data-sim]").onclick = () => { MOCK[t.id].z.push({ id: "z" + Date.now(), author: "Cliente", text: "¿Hay novedades? Necesitamos una fecha firme.", at: now() }); poll(); };
  poll(); setInterval(poll, POLL_MS);
}

/* ================= ARRANQUE ================= */
sessionStorage.getItem("auth") === "1" ? showShell() : showLogin();
</script>
</body>
</html>
